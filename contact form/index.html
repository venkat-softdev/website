<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact form</title>
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lobster&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Margarine&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rock+Salt&family=Satisfy&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <main class="row">
        <!-- ****** left section (column) start -->
        <section class="col left">
          <!-- title start -->

          <div class="contact-title">
            <h2>Get in Touch</h2>
            <p>
              Lorem ipsum dolor sit, amet consectetur adipisicing elit. Tempore
            </p>
          </div>

          <!-- title ends -->

          <!-- contact info starts -->
          <div class="contact-info">
            <div class="icon-group">
              <div class="icon">
                <i class="fa-solid fa-phone"></i>
              </div>

              <div class="details">
                <span>phone</span>
                <span>+00 110 001 00</span>
              </div>
            </div>

            <div class="icon-group">
              <div class="icon">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <div class="details">
                <span>Email</span>
                <span>softedv.venkat@gamil.com</span>
              </div>
            </div>

            <div class="icon-group">
              <div class="icon">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <div class="details">
                <span>Location</span>
                <span>X-Street ,y-Road,cuddlore</span>
              </div>
            </div>
          </div>
          <!-- ****contact info ends**** -->

          <!-- *****social media start -->
          <div class="social-media">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-github"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
          </div>

          <!-- social media ends -->
        </section>

        <!-- ***left section(column) ends -->

        <!-- *****right section column start -->

        <section class="col right">
          <!-- *** form start -->

          <form class="message-form">
            <div class="inputgroup halfwidth">
              <input type="text" name="" required />
              <label> Your Name</label>
            </div>

            <div class="inputgroup halfwidth">
              <input type="Email" name="" required="required" />
              <label>Email</label>
            </div>

            <div class="inputgroup fullwidth">
              <input type="text" name="" required="required" />
              <label> Subject</label>
            </div>

            <div class="inputgroup fullwidth">
              <textarea required="required"></textarea>
              <label> Say Something</label>
            </div>

            <div class="inputgroup fullwidth">
              <button>Send Message</button>
            </div>
          </form>

          <!--*** form ends***  -->
        </section>

        <!-- ****right section col ends -->
      </main>
    </div>
  </body>
</html>
